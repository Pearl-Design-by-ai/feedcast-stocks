name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          OPENNEXT_TARGET: cloudflare
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Build-time fetch of the Learn article library (SSG) from the private
          # markets-engine. Without these, generateStaticParams() gets [] and the
          # /learn/[slug] pages would not be pre-rendered.
          MARKETS_ENGINE_URL: ${{ secrets.MARKETS_ENGINE_URL }}
          MARKETS_ENGINE_TOKEN: ${{ secrets.MARKETS_ENGINE_TOKEN }}
      - name: Deploy main worker
        run: npx wrangler deploy
        env:
          # Scoped API token auth — create a Cloudflare API token with the
          # "Edit Cloudflare Workers" permission and store it as the
          # CLOUDFLARE_API_TOKEN repo secret. Wrangler picks it up automatically.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy cron worker
        working-directory: cron-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
